[pytest]
# Repository root on sys.path so `backend` and `tests` import without a
# manually-set PYTHONPATH (BE-023 §2/§8: explicit environment, no guessing).
pythonpath = .

testpaths =
    tests

# Real failures must not be hidden. No blanket ignore/skip of errors.
addopts =
    -ra
    --strict-markers

markers =
    be023: BE-023 verification-hardening tests
    integration: requires the explicit test database and live dependencies
